# Tiny fast config for tests / CI smoke runs (~seconds)
seed: 7

world:
  arena: 256.0
  app_dim: 32
  n_prefix: 4
  n_post: 4
  step_sigma: 1.5
  drift_rate: 0.12
  placebo_eps: 0.05
  jump_distractor_dist: 150.0

tracker:
  lambda_loc: 0.5
  sigma_loc: 12.0
  mem_size: 6
  mem_decay: 0.65
  accept_threshold: 0.35
  score_noise: 0.01

grid:
  displacements: [8, 32]
  gaps: [1, 8]
  similarities: [0.5]
  trials_per_cell: 30

experiments:
  arbitration_conditions: [swap]
  baseline_trials_per_cell: 20
  lambda_sweep: [0.2, 0.8]
  lambda_sweep_trials: 30
  lambda_sweep_subgrid:
    displacements: [32]
    gaps: [8]
    similarities: [0.5]
  persistence:
    cell: {displacement: 16, gap: 4, similarity: 0.5}
    trials: 50
    lambdas: [0.2, 0.8]
  placebo_trials: 50
  appearance_flip_trials: 50
