splits:
  policy: |
    Published splits used where they exist. For rater study and probe experiments,
    image-level sampling within test splits is allowed (single images, no sequences);
    for FIgLib-derived sequences, splits are BY SEQUENCE/CAMERA to prevent
    near-duplicate leakage between train/probe-val/test. Frozen at R0.
